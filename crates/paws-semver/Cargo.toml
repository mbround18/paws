[package]
name = "paws-semver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# paws ships as a binary, not as crates on crates.io. Marking it explicitly
# keeps an accidental `cargo publish` from succeeding, and lets `cargo deny`
# treat the intra-workspace `path` dependencies as the private edges they are.
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
reqwest.workspace = true
schemars.workspace = true
# Only `paws-cli-core` needs `Increment` to be a clap value type; same optional
# arrangement paws-core and paws-provision use for the same reason.
clap = { workspace = true, optional = true }

[features]
default = []
cli = ["dep:clap"]
