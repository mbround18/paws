[package]
name = "paws-docs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# paws ships as a binary, not as crates on crates.io. Marking it explicitly
# keeps an accidental `cargo publish` from succeeding, and lets `cargo deny`
# treat the intra-workspace `path` dependencies as the private edges they are.
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
paws-release = { path = "../paws-release" }
# `manifest_digest` is persisted on the publish branch and compared against on
# the *next* run, so it needs a hash whose output is fixed by a specification
# rather than by whichever std version built the binary. Same version
# paws-dagger already uses.
sha2 = "0.11"

[dev-dependencies]
serde_json.workspace = true
base64.workspace = true
