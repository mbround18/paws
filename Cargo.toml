[workspace]
resolver = "2"
members = [
    "crates/paws-cli",
    "crates/paws-cli-core",
    "crates/paws-core",
    "crates/paws-dagger",
    "crates/paws-cache",
    "crates/paws-environment",
    "crates/paws-provision",
    "crates/paws-semver",
    "crates/paws-audit",
    "crates/paws-docker",
    "crates/paws-docs",
    "crates/paws-release",
    "crates/paws-node",
    "crates/paws-tauri",
    "crates/paws-python",
    "crates/paws-rust",
    "crates/paws-go",
    "crates/paws-java",
    "crates/paws-kotlin",
    "crates/paws-publish",
    "crates/paws-flatpak",
    "crates/paws-helm",
    "crates/paws-mcp",
    "crates/paws-changelog",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/MBRound18/paws"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
schemars = "1"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
gag = "1"
async-trait = "0.1"
