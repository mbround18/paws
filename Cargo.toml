[workspace]
resolver = "2"
members = [
    "crates/paws-cli",
    "crates/paws-core",
    "crates/paws-dagger",
    "crates/paws-provision",
    "crates/paws-semver",
    "crates/paws-audit",
    "crates/paws-docker",
    "crates/paws-docs",
    "crates/paws-release",
    "crates/paws-node",
    "crates/paws-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/MBRound18/paws"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
