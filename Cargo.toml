[workspace]
resolver = "2"
members = [
    "crates/paws-cli",
    "crates/paws-cli-core",
    "crates/paws-core",
    "crates/paws-dagger",
    "crates/paws-cache",
    "crates/paws-environment",
    "crates/paws-provision",
    "crates/paws-semver",
    "crates/paws-audit",
    "crates/paws-docker",
    "crates/paws-docs",
    "crates/paws-release",
    "crates/paws-node",
    "crates/paws-tauri",
    "crates/paws-python",
    "crates/paws-rust",
    "crates/paws-go",
    "crates/paws-java",
    "crates/paws-kotlin",
    "crates/paws-ruby",
    "crates/paws-php",
    "crates/paws-dotnet",
    "crates/paws-elixir",
    "crates/paws-esp32",
    "crates/paws-publish",
    "crates/paws-flatpak",
    "crates/paws-helm",
    "crates/paws-mcp",
    "crates/paws-changelog",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/MBRound18/paws"

# The gate CI enforces, declared once so a local `cargo clippy` is exactly as
# strict as the pipeline. Before this, `-D warnings` lived only on the CI
# invocation line, so a warning could pass locally and fail on push.
#
# Groups carry `priority = -1` so the individual `allow`s below override them.
# Each opt-out names why: the rule is that a lint is either enforced or has a
# written reason not to be, never silently off.
#
# CI runs a bare `cargo clippy` on purpose: these levels are the gate. Adding
# `-D warnings` back on the command line would re-promote every `warn` here
# (notably `nursery`) to a hard error and undo the distinction.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# `warn`, not `deny`: nursery lints are unstable by definition, and this repo
# pins `channel = "stable"` rather than an exact version — so a Rust release
# can add or change a nursery lint and fail a build that has not changed.
# Keeping them visible locally is worth it; letting them block a release is
# not. Every nursery finding to date is fixed, so this is about future
# releases, not a backlog.
nursery = { level = "warn", priority = -1 }

# --- opt-outs, with reasons -------------------------------------------------

# `#[must_use]`/`# Errors`/`# Panics` doc lints exist for crates published as
# libraries, where a caller reads rustdoc to learn the contract. Every crate
# here is `publish = false` and consumed only by `paws-cli`/`paws-mcp` in this
# workspace, so these would add ~55 doc stanzas that no external reader will
# ever see. Revisit if any crate is ever actually published.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

# This codebase deliberately writes long, explanatory first paragraphs on the
# functions with real history behind them (why a pin exists, what broke). A
# one-line summary rule would push that context further from the code.
too_long_first_doc_paragraph = "allow"

# Transitive duplicates in a tree this size aren't actionable from here, and
# `deny.toml`'s `multiple-versions = "warn"` already reports them where they
# belong — in the supply-chain check, not the compiler.
multiple_crate_versions = "allow"

# `CiArgs`/`DockerArgs` are clap flag bags: a CLI with eight boolean flags is
# eight `bool` fields. Collapsing them into a state enum would make the clap
# derive worse, not better.
struct_excessive_bools = "allow"

[workspace.lints.rust]
# `deny`, not `forbid`: edition 2024 made `std::env::set_var` unsafe, and a
# couple of test modules genuinely need it. Denying rather than forbidding
# means each of those has to carry an explicit, commented `#[allow]` instead
# of unsafe passing unremarked anywhere.
unsafe_code = "deny"
unused_must_use = "deny"
# Elided lifetimes in paths (`Foo` where `Foo<'_>` is meant) hide borrows at
# exactly the places a reader is trying to follow them.
rust_2018_idioms = { level = "deny", priority = -1 }
# A `pub` item not reachable from the crate root is either dead or a missing
# `pub use` — both worth knowing about in a workspace this size.
unreachable_pub = "deny"
# `{:?}` on a value is the first thing anyone reaches for when debugging a
# pipeline; a type without it forces a detour.
missing_debug_implementations = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
schemars = "1"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
gag = "1"
async-trait = "0.1"
