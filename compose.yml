# Builds every ./builders/* Dockerfile and tags it for the registries the
# release pipeline pushes prebuilt builder images to. `paws-release`'s own
# build path never runs `docker compose` itself (see docs/adr/0001) — this
# is release-infra tooling that runs in `.github/workflows/release.yaml`
# before the per-target build matrix, so `paws-dagger::remote_image_exists`
# can find a prebuilt image and skip rebuilding it from scratch. Local
# `docker build`/`dagger core ... docker-build` against these same
# Dockerfiles remains the fallback whenever a prebuilt tag isn't there
# (a fresh builder, or a version this pipeline hasn't run for yet).
#
# Tag scheme is flat repo + "<builder>-<version>" tag
# (mbround18/paws-builders:linux-gnu-v0.0.1), not one repo per builder —
# Docker Hub doesn't support nested repository paths
# (docker.io/<namespace>/<repo>/<subpath> isn't a thing there, only GHCR
# allows that), so both registries need the same flat scheme for this to
# actually push. GHCR is the primary `image:` tag here; the Docker Hub
# push (same flat scheme) happens as a `docker tag`/`docker push` step in
# release.yaml, since compose only carries one `image:` per service.
#
# cache_from/cache_to use BuildKit's registry cache exporter
# (type=registry), one shared "cache-<name>" tag per builder on GHCR only
# (cache doesn't need duplicating to Docker Hub too — it's not a published
# artifact, just build-acceleration state). mode=max exports every layer,
# not just the final image's, so a later build can resume from any step —
# these Dockerfiles are mostly sequential single-stage RUN layers, not
# throwaway intermediate build stages, so there's little to lose by keeping
# all of them. Verified for real, end to end, against a local test
# registry: a *fresh* buildx builder with zero local cache still hit
# CACHED on every layer by importing this, even with BUILDER_CREATED
# changed between builds. This is what actually survives GitHub Actions'
# cold runners across separate workflow runs — local Docker layer cache
# (what builders/*/Dockerfile's own ARG/LABEL reorder protects) only helps
# within a single runner's lifetime, never between them.
#
# Requires a `docker-container` (or other non-default) buildx driver — the
# default `docker` driver doesn't support the registry cache exporter,
# confirmed directly (a `--cache-to type=registry` build fails silently
# short of actually exporting anything under it). release.yaml sets one up
# via docker/setup-buildx-action before running `docker compose build`.
#
# VERSION/REVISION/CREATED are the same build-arg names paws-release passes
# at build time; default to "dev" so `docker compose build` also works
# untagged, for local iteration on a Dockerfile itself.

services:
  linux-gnu:
    build:
      context: ./builders/linux-gnu
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-gnu
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-gnu,mode=max
    image: ghcr.io/mbround18/paws-builders:linux-gnu-${VERSION:-dev}

  linux-musl-x86_64:
