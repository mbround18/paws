# Builds every ./builders/* Dockerfile and tags it for the registries the
# release pipeline pushes prebuilt builder images to. `paws-release`'s own
# build path never runs `docker compose` itself (see docs/adr/0001) — this
# is release-infra tooling that runs in `.github/workflows/release.yaml`
# before the per-target build matrix, so `paws-dagger::remote_image_exists`
# can find a prebuilt image and skip rebuilding it from scratch. Local
# `docker build`/`dagger core ... docker-build` against these same
# Dockerfiles remains the fallback whenever a prebuilt tag isn't there
# (a fresh builder, or a version this pipeline hasn't run for yet).
#
# Tag scheme is flat repo + "<builder>-<version>" tag
# (mbround18/paws-builders:linux-gnu-v0.0.1), not one repo per builder —
# Docker Hub doesn't support nested repository paths
# (docker.io/<namespace>/<repo>/<subpath> isn't a thing there, only GHCR
# allows that), so both registries need the same flat scheme.
#
# Each service tags to GHCR *and* Docker Hub in the same build, both under
# `build.tags` (https://docs.docker.com/reference/compose-file/build/#tags)
# — deliberately *not* split across a top-level `image:` plus `build.tags`.
# That split was tried first and looked right (`docker compose build
# --push` pushed *a* manifest successfully), but `docker buildx bake
# --print` against the generated bake definition showed the real bug:
# when both `image:` and `build.tags` are set, Compose's compose->bake
# translation silently drops the top-level `image:` from the bake target's
# `tags` entirely and keeps only `build.tags` — so only the Docker Hub ref
# ever actually got pushed; GHCR only ever received the registry *cache*,
# never the image itself. Verified directly, twice: once seeing the bug
# (`image:` + `build.tags` -> only one registry populated) and once
# confirming the fix (both refs under `build.tags`, nothing on `image:`
# -> a single push landed the same manifest on both).
#
# release.yaml also runs this through `docker buildx bake -f compose.yml
# --push <service>` rather than `docker compose build --push <service>` —
# a separate, second real bug: on GitHub's runner (Docker Compose v2.38.2)
# specifically, `docker compose build --push` silently loaded the built
# image into the local Docker daemon instead of pushing it at all (no
# "pushing manifest" line, just "exporting to docker image format" /
# "importing to docker" — only the registry cache got pushed). That
# didn't reproduce locally against the same compose.yml, so it's suspected
# to be a compose-version-specific `--push` translation bug rather than
# anything about this file; calling `buildx bake` directly (still reading
# this same compose.yml) reliably produced the correct "exporting to
# image" / "pushing manifest" push path instead. `build-builders` also
# verifies each push actually landed (`docker buildx imagetools inspect`)
# as a belt-and-suspenders check, given how quietly both of these failed.
#
# cache_from/cache_to use BuildKit's registry cache exporter
# (type=registry), one shared "cache-<name>" tag per builder on GHCR only
# (cache doesn't need duplicating to Docker Hub too — it's not a published
# artifact, just build-acceleration state). mode=max exports every layer,
# not just the final image's, so a later build can resume from any step —
# these Dockerfiles are mostly sequential single-stage RUN layers, not
# throwaway intermediate build stages, so there's little to lose by keeping
# all of them. Verified for real, end to end, against a local test
# registry: a *fresh* buildx builder with zero local cache still hit
# CACHED on every layer by importing this, even with BUILDER_CREATED
# changed between builds. This is what actually survives GitHub Actions'
# cold runners across separate workflow runs — local Docker layer cache
# (what builders/*/Dockerfile's own ARG/LABEL reorder protects) only helps
# within a single runner's lifetime, never between them.
#
# Requires a `docker-container` (or other non-default) buildx driver — the
# default `docker` driver doesn't support the registry cache exporter,
# confirmed directly (a `--cache-to type=registry` build fails silently
# short of actually exporting anything under it). release.yaml sets one up
# via docker/setup-buildx-action before running `docker buildx bake`.
#
# VERSION/REVISION/CREATED are the same build-arg names paws-release passes
# at build time; default to "dev" so `docker buildx bake`/`docker compose
# build` also work untagged, for local iteration on a Dockerfile itself.
#
# Every other version-pinning ARG each Dockerfile declares (Node major,
# osxcross commit, macOS SDK, Android cmdline-tools/build-tools/NDK, the
# Flathub runtime) is also passed through here from an environment
# variable, defaulting to that Dockerfile's own default — so bumping any
# one of them is a single `export`/CI variable change here, not a hunt
# through individual Dockerfiles. The Dockerfile defaults still exist and
# still matter (a bare `docker build`, without going through this file,
# falls back to them), this is only about giving the *release* pipeline
# (and anyone else driving builds through `compose.yml`) one place to bump
# from.

services:
  linux-gnu:
    build:
      context: ./builders/linux-gnu
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-gnu
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-gnu,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:linux-gnu-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:linux-gnu-${VERSION:-dev}

  linux-musl-x86_64:
    build:
      context: ./builders/linux-musl-x86_64
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-musl-x86_64
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-musl-x86_64,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:linux-musl-x86_64-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:linux-musl-x86_64-${VERSION:-dev}

  linux-musl-aarch64:
    build:
      context: ./builders/linux-musl-aarch64
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-musl-aarch64
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-linux-musl-aarch64,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:linux-musl-aarch64-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:linux-musl-aarch64-${VERSION:-dev}

  windows-gnu:
    build:
      context: ./builders/windows-gnu
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-windows-gnu
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-windows-gnu,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:windows-gnu-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:windows-gnu-${VERSION:-dev}

  macos:
    build:
      context: ./builders/macos
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
        OSXCROSS_COMMIT: ${OSXCROSS_COMMIT:-27d21e4977c9751d01199c7a226a6faf494c3dd9}
        MACOS_SDK_VERSION: ${MACOS_SDK_VERSION:-14.0}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-macos
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-macos,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:macos-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:macos-${VERSION:-dev}

  tauri-linux:
    build:
      context: ./builders/tauri-linux
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
        NODE_MAJOR: ${NODE_MAJOR:-24}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-tauri-linux
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-tauri-linux,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:tauri-linux-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:tauri-linux-${VERSION:-dev}

  tauri-android:
    build:
      context: ./builders/tauri-android
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
        NODE_MAJOR: ${NODE_MAJOR:-24}
        ANDROID_CMDLINE_TOOLS_VERSION: ${ANDROID_CMDLINE_TOOLS_VERSION:-9862592}
        ANDROID_CMDLINE_TOOLS_SHA1: ${ANDROID_CMDLINE_TOOLS_SHA1:-a787f0c35d3970f2ad634f7d91a2e7bc49e2c7f5}
        ANDROID_PLATFORM: ${ANDROID_PLATFORM:-android-34}
        ANDROID_BUILD_TOOLS_VERSION: ${ANDROID_BUILD_TOOLS_VERSION:-34.0.0}
        ANDROID_NDK_VERSION: ${ANDROID_NDK_VERSION:-27.0.12077973}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-tauri-android
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-tauri-android,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:tauri-android-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:tauri-android-${VERSION:-dev}

  flatpak:
    build:
      context: ./builders/flatpak
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
        FLATPAK_RUNTIME_VERSION: ${FLATPAK_RUNTIME_VERSION:-25.08}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-flatpak
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-flatpak,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:flatpak-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:flatpak-${VERSION:-dev}

  helm:
    build:
      context: ./builders/helm
      args:
        BUILDER_VERSION: ${VERSION:-dev}
        BUILDER_REVISION: ${REVISION:-unknown}
        BUILDER_CREATED: ${CREATED:-unknown}
        HELM_VERSION: ${HELM_VERSION:-v3.16.4}
      cache_from:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-helm
      cache_to:
        - type=registry,ref=ghcr.io/mbround18/paws-builders:cache-helm,mode=max
      tags:
        - ghcr.io/mbround18/paws-builders:helm-${VERSION:-dev}
        - docker.io/mbround18/paws-builders:helm-${VERSION:-dev}
