name: "paws up"
author: mbround18
description: >-
  Downloads a paws release binary for the current runner, puts it on PATH,
  and installs the dagger CLI via `paws init` (most paws subcommands need
  it). Composite (not Docker-based) so paws's own Dagger calls talk to the
  runner's real Docker daemon directly, with no Docker-in-Docker nesting.
  Also exposes the GitHub Actions cache runtime vars (via a pinned
  `actions/github-script` step) so `paws docker`/`paws ci`'s Dagger build
  cache can actually activate - the one non-`paws` action dependency this
  composite carries.
branding:
  icon: "download"
  color: "green"

inputs:
  version:
    description: >-
      paws version to install, e.g. "v0.0.1-prerelease.1". Defaults to the
      most recent GitHub Release (prereleases included — this is meant for
      fast dogfooding iteration, not just stable pins).
    required: false
    default: "latest"
  github-token:
    description: "Token used to query/download releases (avoids low anonymous rate limits)."
    required: false
    default: ${{ github.token }}
  install-dagger:
    description: >-
      Also run `paws init` to install the dagger CLI, which most paws
      subcommands need on PATH. Set to "false" to skip if the runner
      already has it (e.g. a self-hosted runner with dagger pre-installed).
    required: false
    default: "true"

outputs:
  version:
    description: "The resolved paws version that was installed."
    value: ${{ steps.install.outputs.version }}

runs:
  using: "composite"
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        case "$(uname -s)" in
          Linux) os=linux ;;
          Darwin) os=macos ;;
          MINGW*|MSYS*|CYGWIN*) os=windows ;;
          *) echo "::error::Unsupported OS: $(uname -s)"; exit 1 ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch=x86_64 ;;
          arm64|aarch64) arch=aarch64 ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac

        case "$os" in
          linux)
            # Auto-detect musl vs gnu rather than assuming — a plain uname
            # can't tell you this, but the presence of musl's loader can.
            libc=gnu
            if ls /lib/ld-musl-*.so.1 >/dev/null 2>&1; then
              libc=musl
            fi
            target="${arch}-unknown-linux-${libc}"
            exe_name="paws"
            ;;
          macos)
            target="${arch}-apple-darwin"
            exe_name="paws"
            ;;
          windows)
            target="x86_64-pc-windows-gnu"
            exe_name="paws.exe"
            ;;
        esac
        echo "Resolved target: $target"

        install_dir="$HOME/.local/bin"
        mkdir -p "$install_dir"

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT

        # Downloads one version's target archive into $tmp_dir. --retry (no
        # --retry-all-errors) retries transient network/5xx/CDN blips on
        # this exact URL, but fails fast on a real 404 - that 404 is the
        # signal callers use to fall back to a different release instead of
        # hammering a URL that will never succeed.
        try_download() {
          local ver="$1" ver_no_v archive url
          ver_no_v="${ver#v}"
          archive="paws-${ver_no_v}-${target}.zip"
          url="https://github.com/mbround18/paws/releases/download/${ver}/${archive}"
          echo "Trying ${ver}: ${url}"
          curl -fsSL --retry 4 --retry-delay 3 -o "$tmp_dir/$archive" "$url"
        }

        version="$INPUT_VERSION"
        if [ "$version" = "latest" ]; then
          # Retried like the archive download - a transient GitHub API blip
          # here shouldn't fail an install that would otherwise succeed on
          # the next attempt.
          candidates=""
          for i in 1 2 3 4; do
            candidates="$(gh release list --repo mbround18/paws --limit 5 --json tagName -q '.[].tagName' || true)"
            [ -n "$candidates" ] && break
            echo "Retrying release lookup ($i/4)..."
            sleep $((i * 3))
          done
          if [ -z "$candidates" ]; then
            echo "::error::No releases found for mbround18/paws"
            exit 1
          fi

          # Not every release has every target's asset (e.g. one matrix leg
          # failed to build/publish for it) - walk back through the last 5
          # releases, newest first, until one actually has $target, rather
          # than failing an install just because the very latest release is
          # missing this one platform's archive.
          resolved=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if try_download "$candidate"; then
              resolved="$candidate"
              break
            fi
            echo "No $target asset for $candidate, falling back to an older release..."
          done <<< "$candidates"

          if [ -z "$resolved" ]; then
            echo "::error::No $target asset found in the last 5 releases of mbround18/paws"
            exit 1
          fi
          version="$resolved"
        else
          if ! try_download "$version"; then
            echo "::error::No $target asset found for pinned version $version"
            exit 1
          fi
        fi
        echo "Resolved version: $version"

        archive="paws-${version#v}-${target}.zip"
        unzip -o -j "$tmp_dir/$archive" -d "$install_dir"
        chmod +x "$install_dir/$exe_name"

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"

        # Sanity check before trusting this install — same "verify it
        # actually runs, not just that the download succeeded" standard the
        # release pipeline itself holds every binary to.
        "$install_dir/$exe_name" --version

    # Exposes the runtime token plus both cache-service URL vars, and the v2
    # opt-in flag, to every later step in this job via $GITHUB_ENV. GitHub
    # Actions withholds all of these from a plain `run:` (bash) step's
    # process environment - they only reach a JS/Node-based action step,
    # which runs in-process inside the runner's own worker and can see its
    # real internal environment. Without this step,
    # `paws_dagger::CacheBackend::detect()` can never select
    # `GitHubActionsCache`; it always falls through to `None` (a full
    # rebuild, never a broken build - see paws's 006-paws-doesn-expose
    # spec). `ACTIONS_CACHE_SERVICE_V2` decides whether `detect()` targets
    # the newer Cache Service v2 (Twirp/JSON over `ACTIONS_RESULTS_URL`) or
    # the legacy v1 REST API (`ACTIONS_CACHE_URL`) - github.com sets the
    # flag today, and `paws_dagger`'s v2 client is the one confirmed working
    # end to end on a real runner (a real save, then a real restore of that
    # exact archive); exposing only the legacy vars would leave `detect()`
    # falling back to the untested v1 path instead. If `actions/github-script`
    # (or this step) ever breaks, the only observed effect is the cache
    # backend silently staying `None` - nothing else in `paws-up` depends on
    # it. Pinned to a commit SHA, not a floating tag, since it's the one
    # dependency here that touches a sensitive runner-issued credential.
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const vars = [
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_CACHE_URL',
            'ACTIONS_RESULTS_URL',
            'ACTIONS_CACHE_SERVICE_V2'
          ];
          for (const name of vars) {
            const value = process.env[name];
            if (value) core.exportVariable(name, value);
          }

    - if: ${{ inputs.install-dagger == 'true' }}
      shell: bash
      # $GITHUB_PATH was updated in the previous step, so `paws` already
      # resolves here without needing the install directory spelled out.
      run: paws init
