name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yaml call this as a reusable workflow, so a release build
  # always goes through the same fmt/clippy/test/build gate as every push.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      # SC-002: cargo test --workspace passes with zero failures on every commit.
      # This also runs paws-provision's SC-005 concurrency-timing test and
      # paws-docker's real-Docker-daemon e2e suite (FR-007) — ubuntu-latest
      # runners ship Docker; tests that need rustup/corepack/uv skip
      # gracefully (rather than failing) if a given tool isn't present.
      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # SC-004 + docs/adr/0001: zero direct `Command::new("dagger"/"docker"/"cross")`
      # call sites outside crates/paws-dagger (paws-docker's e2e tests excepted).
      - name: SC-004 lint (container-engine call-site check)
        run: ./scripts/check-dagger-callsites.sh

  # spec.md FR-008: `paws ci --toolchain node`, `--toolchain rust`, and
  # `--toolchain python` must each be exercised end-to-end against a real
  # fixture project, not just unit-tested. Separate job: needs the real
  # `dagger` CLI + a Dagger engine (itself running in Docker), so it's kept
  # independent of the fast unit-test job above rather than blocking it on
  # slower infrastructure. All three toolchains build native
  # `paws-dagger::core` pipelines now (no `gh-reusable` dependency) — this
  # job's separation is purely about needing real Dagger, not an external
  # dependency.
  ci-e2e:
    name: paws ci end-to-end (dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build paws
        run: cargo build -p paws-cli

      - name: Install dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

      - name: paws ci --toolchain rust (examples/rust-fixture)
        working-directory: examples/rust-fixture
        run: ../../target/debug/paws ci --toolchain rust

      - name: paws ci --toolchain node (examples/node-fixture)
        working-directory: examples/node-fixture
        run: ../../target/debug/paws ci --toolchain node

      - name: paws ci --toolchain python (examples/python-fixture)
        working-directory: examples/python-fixture
        run: ../../target/debug/paws ci --toolchain python

      # specs/004-rust-coverage/quickstart.md §4: proves cargo llvm-cov
      # measures a real gap (examples/rust-coverage-fixture has one
      # deliberately untested branch), not just running and reporting a
      # fixed number. Asserts the TOTAL line's region-coverage percentage
      # is genuinely between 0% and 100%.
      - name: paws ci --toolchain rust --coverage (examples/rust-coverage-fixture)
        working-directory: examples/rust-coverage-fixture
        run: |
          set -euo pipefail
          output="$(../../target/debug/paws ci --toolchain rust --coverage)"
          echo "$output"
          total_line="$(echo "$output" | grep -E '^TOTAL' | head -1)"
          if [ -z "$total_line" ]; then
            echo "::error::no TOTAL line in cargo llvm-cov output"
            exit 1
          fi
          # Columns: Filename Regions "Missed Regions" Cover Functions ...
          # — "Missed Regions" is two whitespace-separated tokens, so the
          # region Cover% is field 4, not field 3.
          cover_pct="$(echo "$total_line" | awk '{print $4}' | tr -d '%')"
          echo "region coverage: ${cover_pct}%"
          awk -v pct="$cover_pct" 'BEGIN { exit !(pct > 0 && pct < 100) }' || {
            echo "::error::expected coverage strictly between 0% and 100%, got ${cover_pct}%"
            exit 1
          }

  # specs/006-paws-doesn-expose FR-004/SC-001/SC-003: proves, against real
  # GitHub-hosted runners (not a unit test injecting env vars directly), that
  # the fixed `./actions/paws-up` (this branch's own copy, not a published
  # release) actually exposes $ACTIONS_CACHE_URL/$ACTIONS_RUNTIME_TOKEN so
  # `CacheBackend::detect()` selects `GitHubActionsCache` with zero extra
  # consumer-side step, and that a second job's build genuinely benefits
  # from the first job's cache. Two separate jobs (each a fresh runner, so
  # neither has the other's local Docker layer cache) rather than two runs
  # in one job — a same-job comparison would be confounded by the shared
  # Dagger engine container/Docker daemon staying warm regardless of
  # whether `GitHubActionsCache` restore ever ran. `--default-branch
  # __none__` guarantees neither run ever attempts to push, regardless of
  # which branch triggered this workflow.
  github-actions-cache-e2e-cold:
    name: GitHub Actions cache backend (real runner, cold)
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.run.outputs.duration }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      # Builds the `paws` binary under test from *this branch's own source*,
      # not a published release — actions/paws-up (used elsewhere for real
      # consumers) always installs the latest release, which lags whatever
      # cache-backend fix this very commit is trying to validate. Using a
      # release binary here would make this job structurally unable to
      # catch a regression (or confirm a fix) until *after* a release was
      # already cut from it.
      - name: Build paws
        run: cargo build -p paws-cli

      - name: Put target/debug on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Install dagger CLI
        run: paws init

      # Exposes $ACTIONS_RUNTIME_TOKEN/$ACTIONS_CACHE_URL to later `run:` (bash)
      # steps in this job — GitHub Actions withholds them from a plain bash
      # step's process environment; only a JS/Node-based action step can see
      # them. Mirrors actions/paws-up's own step (that action isn't used in
      # this job since it would download a release binary instead of using
      # the one just built above).
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env['ACTIONS_RUNTIME_TOKEN'];
            const url = process.env['ACTIONS_CACHE_URL'];
            if (token) core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
            if (url) core.exportVariable('ACTIONS_CACHE_URL', url);

      - name: paws docker (cold run)
        id: run
        working-directory: examples/docker-fixture
        run: |
          set -euo pipefail
          start=$(date +%s)
          # 2>&1: CacheBackend::log_line() and its restore/save status lines
          # go to stderr, not stdout — a plain `$(cmd)` capture would miss
          # them entirely and always fail the grep below regardless of
          # whether the cache backend actually activated.
          output="$(paws docker --image ghcr.io/example/paws-cache-e2e-fixture --dockerfile Dockerfile --default-branch __none__ 2>&1)"
          end=$(date +%s)
          echo "$output"
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "$output" | grep -qF 'cache: using github-actions' || {
            echo "::error::expected 'cache: using github-actions' in paws docker's log output — GitHubActionsCache did not activate on this real runner"
            exit 1
          }

  github-actions-cache-e2e-warm:
    name: GitHub Actions cache backend (real runner, warm)
    needs: github-actions-cache-e2e-cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      # Same rationale as the cold job above: build from source, not a
      # published release, so this validates the fix actually on this branch.
      - name: Build paws
        run: cargo build -p paws-cli

      - name: Put target/debug on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Install dagger CLI
        run: paws init

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env['ACTIONS_RUNTIME_TOKEN'];
            const url = process.env['ACTIONS_CACHE_URL'];
            if (token) core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
            if (url) core.exportVariable('ACTIONS_CACHE_URL', url);

      - name: paws docker (warm run, same unchanged Dockerfile)
        id: run
        working-directory: examples/docker-fixture
        run: |
          set -euo pipefail
          start=$(date +%s)
          # 2>&1: CacheBackend::log_line() and its restore/save status lines
          # go to stderr, not stdout — a plain `$(cmd)` capture would miss
          # them entirely and always fail the grep below regardless of
          # whether the cache backend actually activated.
          output="$(paws docker --image ghcr.io/example/paws-cache-e2e-fixture --dockerfile Dockerfile --default-branch __none__ 2>&1)"
          end=$(date +%s)
          echo "$output"
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "$output" | grep -qF 'cache: using github-actions' || {
            echo "::error::expected 'cache: using github-actions' in paws docker's log output on the warm run too"
            exit 1
          }

      # SC-003: informational, not a hard gate — wall-clock timing across two
      # independent GitHub-hosted runners is noisy enough (neighbor
      # contention, registry pull variance) that failing the whole required
      # "build, test, lint" gate on a timing regression would trade CI
      # stability for a metric this job already proves the mechanism for via
      # the log assertions above. A maintainer reviewing this job's summary
      # still sees the real numbers every run.
      - name: Report cold vs warm timing (SC-003)
        run: |
          cold=${{ needs.github-actions-cache-e2e-cold.outputs.duration }}
          warm=${{ steps.run.outputs.duration }}
          echo "cold run: ${cold}s, warm run: ${warm}s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$warm" -ge "$cold" ]; then
            echo "::warning::warm run (${warm}s) was not faster than cold run (${cold}s) — investigate if this persists across multiple runs"
          fi

  # Regenerates llms.txt (docs/ROADMAP.md's `paws llms generate`) and
  # commits it back to main via the Contents API — the same
  # get_content/put_content pattern `paws helm --publish` already uses for
  # index.yaml, so no local git identity/worktree is needed here either.
  # Gated to pushes to main (a PR merge is itself a push event, so this
  # covers "every push / PR merge" with one trigger); `paws llms generate
  # --publish` skips the commit itself when the content is unchanged, so
  # this can't retrigger itself indefinitely.
  #
  # `main`'s ruleset requires the "build, test, lint" status check on every
  # commit, including ones made via the Contents API — the default
  # `GITHUB_TOKEN` (acting as the `github-actions` app) only bypasses that
  # rule for commits that go through a pull request, so a direct commit with
  # it gets rejected (409). The repo's own GitHub App (bypass_mode
  # "always" on the ruleset) doesn't have that restriction, so this job
  # authenticates as it instead — natively, via `paws_environment::
  # resolve_github_token` (crates/paws-environment/src/lib.rs), which mints
  # a short-lived installation token itself whenever $GH_APP_CLIENT_ID plus
  # a private key are present, no `actions/create-github-app-token` step
  # needed (that Action's job is now just what `paws` does for every
  # `--publish`/`--push` path automatically).
  llms:
    name: regenerate llms.txt
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build paws
        run: cargo build -p paws-cli

      - name: paws llms generate --publish
        run: ./target/debug/paws llms generate --publish
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
