name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yaml call this as a reusable workflow, so a release build
  # always goes through the same fmt/clippy/test/build gate as every push.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: determine changed scope
    runs-on: ubuntu-latest
    outputs:
      run_languages: ${{ steps.matrix.outputs.run_languages }}
      language_matrix: ${{ steps.matrix.outputs.language_matrix }}
      run_cache_e2e: ${{ steps.matrix.outputs.run_cache_e2e }}
    steps:
      - name: Build dynamic matrix and job gates
        id: matrix
        uses: actions/github-script@v8
        with:
          script: |-
            const isPullRequest = context.eventName === "pull_request";
            const files = [];
            if (isPullRequest) {
              const number = context.payload.pull_request.number;
              const changed = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: number,
                  per_page: 100
                }
              );
              for (const file of changed) files.push(file.filename);
            }

            const runAll = !isPullRequest;
            const hasPath = (prefixes) => runAll || files.some((f) => prefixes.some((p) => f.startsWith(p)));

            const ciCore = hasPath([
              "Cargo.toml",
              "Cargo.lock",
              "deny.toml",
              ".github/workflows/ci.yaml",
              "actions/",
              "scripts/",
              "crates/paws-cli/",
              "crates/paws-cli-core/",
              "crates/paws-core/",
              "crates/paws-dagger/",
              "crates/paws-environment/"
            ]);

            const cacheE2E = hasPath([
              "crates/paws-cache/",
              "crates/paws-dagger/",
              "crates/paws-docker/",
              "actions/paws-up/",
              "examples/docker-fixture/",
              "examples/docker-labels-fixture/",
              "examples/docker-multi-target-fixture/"
            ]);

            const languageScopes = {
              java: [
                "crates/paws-java/",
                "builders/java/",
                "examples/java-maven-fixture/",
                "examples/java-gradle-fixture/",
                "examples/java-jdk25-toolchain-fixture/"
              ],
              kotlin: [
                "crates/paws-kotlin/",
                "builders/java/",
                "examples/kotlin-fixture/",
                "examples/java-kotlin-mixed-fixture/"
              ],
              ruby: [
                "crates/paws-ruby/",
                "builders/ruby/",
                "examples/ruby-fixture/"
              ],
              php: [
                "crates/paws-php/",
                "builders/php/",
                "examples/php-fixture/"
              ],
              dotnet: [
                "crates/paws-dotnet/",
                "builders/dotnet/",
                "examples/dotnet-fixture/"
              ],
              elixir: [
                "crates/paws-elixir/",
                "builders/elixir/",
                "examples/elixir-fixture/"
              ],
              ansible: [
                "crates/paws-ansible/",
                "builders/ansible/",
                "examples/ansible-fixture/"
              ]
            };

            const include = [];
            const add = (toolchain, fixture) => include.push({ toolchain, fixture });

            if (ciCore || hasPath(languageScopes.java)) {
              add("java", "java-maven-fixture");
              add("java", "java-gradle-fixture");
              add("java", "java-jdk25-toolchain-fixture");
            }
            if (ciCore || hasPath(languageScopes.kotlin)) {
              add("kotlin", "kotlin-fixture");
              add("kotlin", "java-kotlin-mixed-fixture");
            }
            if (ciCore || hasPath(languageScopes.ruby)) add("ruby", "ruby-fixture");
            if (ciCore || hasPath(languageScopes.php)) add("php", "php-fixture");
            if (ciCore || hasPath(languageScopes.dotnet)) add("dotnet", "dotnet-fixture");
            if (ciCore || hasPath(languageScopes.elixir)) add("elixir", "elixir-fixture");
            if (ciCore || hasPath(languageScopes.ansible)) add("ansible", "ansible-fixture");

            core.info(`Changed files (${files.length}): ${files.join(", ") || "(non-PR event; full matrix enabled)"}`);
            core.setOutput("run_languages", include.length > 0 ? "true" : "false");
            core.setOutput("language_matrix", JSON.stringify({ include }));
            core.setOutput("run_cache_e2e", (ciCore || cacheE2E) ? "true" : "false");

  test:
    name: build, test, lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      # SC-002: cargo test --workspace passes with zero failures on every commit.
      # This also runs paws-provision's SC-005 concurrency-timing test and
      # paws-docker's real-Docker-daemon e2e suite (FR-007) — ubuntu-latest
      # runners ship Docker; tests that need rustup/corepack/uv skip
      # gracefully (rather than failing) if a given tool isn't present.
      - name: Test workspace
        run: cargo test --workspace

      # No `-D warnings` here on purpose: lint levels live in
      # `[workspace.lints]` (Cargo.toml), so a local `cargo clippy` is exactly
      # this gate. Passing `-D warnings` would re-promote every `warn`-level
      # lint — notably the deliberately non-blocking `nursery` group — into a
      # hard error and undo that distinction.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # SC-004 + docs/adr/0001: zero direct `Command::new("dagger"/"docker"/"cross")`
      # call sites outside crates/paws-dagger (paws-docker's e2e tests excepted).
      - name: SC-004 lint (container-engine call-site check)
        run: ./scripts/check-dagger-callsites.sh

      # `paws audit` runs supply-chain scanning for consumer repos; this is the
      # same discipline applied to paws's own dependency tree (deny.toml).
      # Advisories, licenses, banned crates, and unexpected registries.
      - name: Supply-chain check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # spec.md FR-008: `paws ci --toolchain node`, `--toolchain rust`, and
  # `--toolchain python` must each be exercised end-to-end against a real
  # fixture project, not just unit-tested. Separate job: needs the real
  # `dagger` CLI + a Dagger engine (itself running in Docker), so it's kept
  # independent of the fast unit-test job above rather than blocking it on
  # slower infrastructure. All three toolchains build native
  # `paws-dagger::core` pipelines now (no `gh-reusable` dependency) — this
  # job's separation is purely about needing real Dagger, not an external
  # dependency.
  ci-e2e:
    name: paws ci end-to-end (dagger)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build paws
        run: cargo build -p paws-cli

      - name: Install dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

      - name: paws ci --toolchain rust (examples/rust-fixture)
        working-directory: examples/rust-fixture
        run: ../../target/debug/paws ci --toolchain rust

      - name: paws ci --toolchain node (examples/node-fixture)
        working-directory: examples/node-fixture
        run: ../../target/debug/paws ci --toolchain node

      - name: paws ci --toolchain python (examples/python-fixture)
        working-directory: examples/python-fixture
        run: ../../target/debug/paws ci --toolchain python

      # A project with no pytest and no tests must build and skip the test
      # step, not fail on a tool it never asked for. Asserting the message
      # (not just the exit code) keeps a silently-skipped real test suite
      # from passing this leg too.
      - name: paws ci --toolchain python, no tests (examples/python-no-tests-fixture)
        working-directory: examples/python-no-tests-fixture
        run: |
          set -euo pipefail
          output="$(../../target/debug/paws ci --toolchain python)"
          echo "$output"
          grep -q "no tests to run" <<<"$output"

      # specs/004-rust-coverage/quickstart.md §4: proves cargo llvm-cov
      # measures a real gap (examples/rust-coverage-fixture has one
      # deliberately untested branch), not just running and reporting a
      # fixed number. Asserts the TOTAL line's region-coverage percentage
      # is genuinely between 0% and 100%.
      - name: paws ci --toolchain rust --coverage (examples/rust-coverage-fixture)
        working-directory: examples/rust-coverage-fixture
        run: |
          set -euo pipefail
          output="$(../../target/debug/paws ci --toolchain rust --coverage)"
          echo "$output"
          total_line="$(echo "$output" | grep -E '^TOTAL' | head -1)"
          if [ -z "$total_line" ]; then
            echo "::error::no TOTAL line in cargo llvm-cov output"
            exit 1
          fi
          # Columns: Filename Regions "Missed Regions" Cover Functions ...
          # — "Missed Regions" is two whitespace-separated tokens, so the
          # region Cover% is field 4, not field 3.
          cover_pct="$(echo "$total_line" | awk '{print $4}' | tr -d '%')"
          echo "region coverage: ${cover_pct}%"
          awk -v pct="$cover_pct" 'BEGIN { exit !(pct > 0 && pct < 100) }' || {
            echo "::error::expected coverage strictly between 0% and 100%, got ${cover_pct}%"
            exit 1
          }

  # The same FR-008 "exercised end-to-end against a real fixture, not just
  # unit-tested" rule as `ci-e2e` above, for the JVM/Ruby/PHP/.NET/Elixir
  # toolchains. A separate, matrixed job rather than more steps on `ci-e2e`:
  # these are independent (nothing shared between a Gradle build and a
  # `dotnet restore`) and individually slow — a Gradle or .NET cold run is
  # minutes of image pull plus dependency resolution — so running them in
  # parallel keeps the wall clock at "the slowest one" instead of "the sum".
  # Two Java fixtures because `paws-java` has two genuinely different build
  # systems to detect (Maven and Gradle), and `java-jdk25-toolchain-fixture`
  # because it's the only one that proves `builders/java`'s JDK 21 + JDK 25
  # split resolves a real `java.toolchain.languageVersion` requirement.
  ci-e2e-languages:
    name: paws ci ${{ matrix.toolchain }} (${{ matrix.fixture }})
    # Pull requests only, deliberately — unlike `ci-e2e` above, which stays
    # on every trigger. These ten legs each install real dependencies from
    # rubygems/packagist/nuget.org/hex.pm/galaxy.ansible.com at run time, so an outage at any
    # one of those would block an unrelated release that has nothing to do
    # with that language. Measured before scoping this: they are *not* a
    # release-latency problem (all ten run in parallel, 0-1m each, against
    # a 2-minute CI gate whose critical path is `paws ci end-to-end
    # (dagger)` at 2m) — this is purely about not coupling releases to four
    # more third-party registries.
    #
    # `github.event_name` inside a reusable workflow reports the *caller's*
    # triggering event, so this one condition covers all three non-PR
    # paths: a push to main, a `v*` tag push, and release.yaml's
    # workflow_dispatch. Every change reaches main through a PR, where
    # these already ran against the identical SHA (the merge is a
    # fast-forward), so nothing goes unverified.
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_languages == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.language_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build paws
        run: cargo build -p paws-cli

      - name: Install dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

      - name: paws ci --toolchain ${{ matrix.toolchain }} (examples/${{ matrix.fixture }})
        working-directory: examples/${{ matrix.fixture }}
        run: ../../target/debug/paws ci --toolchain ${{ matrix.toolchain }}

  # specs/006-paws-doesn-expose FR-004/SC-001/SC-003: proves, against real
  # GitHub-hosted runners (not a unit test injecting env vars directly), that
  # the fixed `./actions/paws-up` (this branch's own copy, not a published
  # release) actually exposes $ACTIONS_CACHE_URL/$ACTIONS_RUNTIME_TOKEN so
  # `CacheBackend::detect()` selects `GitHubActionsCache` with zero extra
  # consumer-side step, and that a second job's build genuinely benefits
  # from the first job's cache. Two separate jobs (each a fresh runner, so
  # neither has the other's local Docker layer cache) rather than two runs
  # in one job — a same-job comparison would be confounded by the shared
  # Dagger engine container/Docker daemon staying warm regardless of
  # whether `GitHubActionsCache` restore ever ran. `--default-branch
  # __none__` guarantees neither run ever attempts to push, regardless of
  # which branch triggered this workflow.
  github-actions-cache-e2e-cold:
    name: GitHub Actions cache backend (real runner, cold)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_cache_e2e == 'true'
    runs-on: ubuntu-latest
    # These jobs exist to exercise saving, and they run on pull_request, where the
    # default policy deliberately does not save.
    env:
      PAWS_CACHE_SAVE: always
    outputs:
      duration: ${{ steps.run.outputs.duration }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      # Builds the `paws` binary under test from *this branch's own source*,
      # not a published release — actions/paws-up (used elsewhere for real
      # consumers) always installs the latest release, which lags whatever
      # cache-backend fix this very commit is trying to validate. Using a
      # release binary here would make this job structurally unable to
      # catch a regression (or confirm a fix) until *after* a release was
      # already cut from it.
      - name: Build paws
        run: cargo build -p paws-cli

      - name: Put target/debug on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Install dagger CLI
        run: paws init

      # Exposes the runtime token plus both cache-service URL vars, and the
      # v2 opt-in flag, to later `run:` (bash) steps in this job — GitHub
      # Actions withholds all of these from a plain bash step's process
      # environment; only a JS/Node-based action step can see them. Mirrors
      # actions/paws-up's own step (that action isn't used in this job
      # since it would download a release binary instead of using the one
      # just built above).
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const vars = [
              'ACTIONS_RUNTIME_TOKEN',
              'ACTIONS_CACHE_URL',
              'ACTIONS_RESULTS_URL',
              'ACTIONS_CACHE_SERVICE_V2'
            ];
            for (const name of vars) {
              const value = process.env[name];
              if (value) core.exportVariable(name, value);
            }

      # `paws cache --json` runs the exact same detection
      # `restore_cache_backend`/`save_cache_backend` use internally
      # (paws_dagger::CacheBackend::detect()), so this is a direct
      # assertion on the real selection, not a grep over free-text build
      # log lines — no `pipefail`/broken-pipe footgun like the old
      # `echo ... | grep -q` version had, and no dependency on exactly
      # what CacheBackend::log_line() happens to say.
      - name: Verify cache backend selection
        run: |
          set -euo pipefail
          paws cache --json | tee /tmp/paws-cache-status.json
          backend="$(jq -r '.backend' /tmp/paws-cache-status.json)"
          if [ "$backend" != "github-actions" ]; then
            echo "::error::expected paws cache --json's backend to be 'github-actions', got '$backend' — GitHubActionsCache did not activate on this real runner"
            exit 1
          fi

      - name: paws docker (cold run)
        id: run
        working-directory: examples/docker-fixture
        run: |
          set -euo pipefail
          start=$(date +%s)
          paws docker --image ghcr.io/example/paws-cache-e2e-fixture --dockerfile Dockerfile --default-branch __none__
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Check for paws artifacts
        id: check-artifacts
        run: |
          if [ -d "$GITHUB_WORKSPACE/paws-artifacts" ] && [ "$(ls -A $GITHUB_WORKSPACE/paws-artifacts)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload paws artifacts
        if: steps.check-artifacts.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paws-engine-state
          path: paws-artifacts/**

  github-actions-cache-e2e-warm:
    name: GitHub Actions cache backend (real runner, warm)
    needs: github-actions-cache-e2e-cold
    runs-on: ubuntu-latest
    # These jobs exist to exercise saving, and they run on pull_request, where the
    # default policy deliberately does not save.
    env:
      PAWS_CACHE_SAVE: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      # Same rationale as the cold job above: build from source, not a
      # published release, so this validates the fix actually on this branch.
      - name: Build paws
        run: cargo build -p paws-cli

      - name: Put target/debug on PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Install dagger CLI
        run: paws init

      # See the cold job's step of the same name for why all four vars.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const vars = [
              'ACTIONS_RUNTIME_TOKEN',
              'ACTIONS_CACHE_URL',
              'ACTIONS_RESULTS_URL',
              'ACTIONS_CACHE_SERVICE_V2'
            ];
            for (const name of vars) {
              const value = process.env[name];
              if (value) core.exportVariable(name, value);
            }

      # See the cold job's comment on this same check.
      - name: Verify cache backend selection
        run: |
          set -euo pipefail
          paws cache --json | tee /tmp/paws-cache-status.json
          backend="$(jq -r '.backend' /tmp/paws-cache-status.json)"
          if [ "$backend" != "github-actions" ]; then
            echo "::error::expected paws cache --json's backend to be 'github-actions' on the warm run too, got '$backend'"
            exit 1
          fi

      - name: paws docker (warm run, same unchanged Dockerfile)
        id: run
        working-directory: examples/docker-fixture
        run: |
          set -euo pipefail
          start=$(date +%s)
          paws docker --image ghcr.io/example/paws-cache-e2e-fixture --dockerfile Dockerfile --default-branch __none__ 2>&1 | tee /tmp/paws-warm.log
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Check for paws artifacts
        id: check-artifacts
        run: |
          if [ -d "$GITHUB_WORKSPACE/paws-artifacts" ] && [ "$(ls -A $GITHUB_WORKSPACE/paws-artifacts)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload paws artifacts
        if: steps.check-artifacts.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paws-engine-state
          path: paws-artifacts/**

      # The cold job saved under a key of its own; this job finds that entry
      # through the prefix every run shares. A single fixed key instead froze
      # the cache at whatever the first run ever saved. The save here is then
      # skipped because the cold job already wrote this run's key.
      - name: Verify the rolling cache key restored the cold job's entry
        run: |
          set -euo pipefail
          grep -q "restored the newest github-actions cache entry under paws-dagger-engine-state-v2-" /tmp/paws-warm.log
          grep -q "is already claimed by this run" /tmp/paws-warm.log

      # Labels have to reach the built image, not just the command line: registries
      # read org.opencontainers.image.source to link a package back to its repository,
      # and an image published without it loses that link. Build args have to reach the
      # build itself, which the fixture echoes.
      - name: paws docker applies labels and build args
        working-directory: examples/docker-labels-fixture
        run: |
          set -euo pipefail
          output="$(paws docker --image ghcr.io/example/paws-label-fixture \
            --dockerfile Dockerfile --default-branch __none__ \
            --label org.opencontainers.image.source=https://github.com/example/repo \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --build-arg BUILD_ARG_PROBE=passed-through 2>&1)"
          echo "$output"
          grep -q "build-arg-probe=passed-through" <<<"$output"

          # Read the labels back off an image built the same way. `paws docker` without
          # a registry to publish to only builds, so there is nothing to inspect from
          # the run above itself.
          dagger core host directory --path=. docker-build --dockerfile=Dockerfile \
            with-label --name=org.opencontainers.image.source --value=https://github.com/example/repo \
            export --path=/tmp/paws-labelled.tar
          # Extract first rather than piping tar into grep: `grep -q` exits at the
          # first match, tar dies of SIGPIPE, and pipefail fails the step.
          mkdir -p /tmp/paws-labelled
          tar -xf /tmp/paws-labelled.tar -C /tmp/paws-labelled
          grep -rq "org.opencontainers.image.source" /tmp/paws-labelled

      # One invocation, two images out of one Dockerfile. Both builds run
      # against this job's engine, so the stage they share is built for the
      # first and reused by the second.
      - name: paws docker builds two targets in one invocation
        working-directory: examples/docker-multi-target-fixture
        run: |
          set -euo pipefail
          output="$(paws docker \
            --image ghcr.io/example/paws-multi-alpha,ghcr.io/example/paws-multi-beta \
            --target alpha,beta \
            --dockerfile Dockerfile --default-branch __none__ 2>&1)"
          echo "$output"
          grep -q "build 1/2 — image=ghcr.io/example/paws-multi-alpha target=alpha" <<<"$output"
          grep -q "build 2/2 — image=ghcr.io/example/paws-multi-beta target=beta" <<<"$output"
          [ "$(grep -c "docker: build succeeded" <<<"$output")" -eq 2 ]

      # Several stages under one image name collide on tags unless they are
      # prefixed, so that combination is refused rather than silently
      # publishing one over the other.
      - name: paws docker refuses two targets sharing one image name
        working-directory: examples/docker-multi-target-fixture
        run: |
          set -euo pipefail
          if output="$(paws docker --image ghcr.io/example/paws-multi --target alpha,beta \
            --dockerfile Dockerfile --default-branch __none__ 2>&1)"; then
            echo "expected a failure, got:"; echo "$output"; exit 1
          fi
          echo "$output"
          grep -q -- "--prepend-target" <<<"$output"

      # A second paws call in the same job must not restore the cache over the
      # engine the first call left running (that corrupted its snapshot store:
      # `failed to rename ... file exists`), and must not re-upload an entry
      # this run already saved.
      - name: paws docker again in the same job
        working-directory: examples/docker-fixture
        run: |
          set -euo pipefail
          output="$(paws docker --image ghcr.io/example/paws-cache-e2e-fixture --dockerfile Dockerfile --default-branch __none__ 2>&1)"
          echo "$output"
          grep -q "already restored earlier in this job" <<<"$output"
          grep -q "is already claimed by this run" <<<"$output"

      # SC-003: informational, not a hard gate — wall-clock timing across two
      # independent GitHub-hosted runners is noisy enough (neighbor
      # contention, registry pull variance) that failing the whole required
      # "build, test, lint" gate on a timing regression would trade CI
      # stability for a metric this job already proves the mechanism for via
      # the log assertions above. A maintainer reviewing this job's summary
      # still sees the real numbers every run.
      - name: Report cold vs warm timing (SC-003)
        run: |
          cold=${{ needs.github-actions-cache-e2e-cold.outputs.duration }}
          warm=${{ steps.run.outputs.duration }}
          echo "cold run: ${cold}s, warm run: ${warm}s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$warm" -ge "$cold" ]; then
            echo "::warning::warm run (${warm}s) was not faster than cold run (${cold}s) — investigate if this persists across multiple runs"
          fi

  # Regenerates llms.txt (docs/ROADMAP.md's `paws llms generate`) and
  # commits it back to main via the Contents API — the same
  # get_content/put_content pattern `paws helm --publish` already uses for
  # index.yaml, so no local git identity/worktree is needed here either.
  # Gated to pushes to main (a PR merge is itself a push event, so this
  # covers "every push / PR merge" with one trigger); `paws llms generate
  # --publish` skips the commit itself when the content is unchanged, so
  # this can't retrigger itself indefinitely.
  #
  # `main`'s ruleset requires the "build, test, lint" status check on every
  # commit, including ones made via the Contents API — the default
  # `GITHUB_TOKEN` (acting as the `github-actions` app) only bypasses that
  # rule for commits that go through a pull request, so a direct commit with
  # it gets rejected (409). The repo's own GitHub App (bypass_mode
  # "always" on the ruleset) doesn't have that restriction, so this job
  # authenticates as it instead — natively, via `paws_environment::
  # resolve_github_token` (crates/paws-environment/src/lib.rs), which mints
  # a short-lived installation token itself whenever $GH_APP_CLIENT_ID plus
  # a private key are present, no `actions/create-github-app-token` step
  # needed (that Action's job is now just what `paws` does for every
  # `--publish`/`--push` path automatically).
  llms:
    name: regenerate llms.txt
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Build paws
        run: cargo build -p paws-cli

      - name: paws llms generate --publish
        run: ./target/debug/paws llms generate --publish
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
