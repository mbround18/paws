name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1-prerelease.1); must already exist"
        required: true

permissions:
  contents: write

jobs:
  # Dogfooding: `paws ci` (fmt/clippy/build/test) gates the release the same
  # way it gates every other push — a release build never skips its own CI.
  ci:
    uses: ./.github/workflows/ci.yaml

  # Bootstrap the native `paws` binary exactly once, publish it as an
  # artifact — there's nothing target-specific about this build, so every
  # later `paws release --target ...` leg downloads it instead of repeating
  # the compile itself.
  bootstrap:
    name: bootstrap paws binary
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - name: Bootstrap host paws binary
        run: cargo build --release -p paws-cli

      - name: Upload bootstrapped paws binary
        uses: actions/upload-artifact@v4
        with:
          name: paws-bootstrap
          path: target/release/paws
          retention-days: 1

  # Builds/pushes every ./builders/* Dockerfile before the target matrix
  # below starts, so each leg can find a prebuilt image already there
  # (paws_dagger::remote_image_exists) instead of paying for its own layer
  # build from scratch. One runner per builder (matrix), not all 7 on a
  # single runner: building them concurrently on one machine exhausted a
  # GitHub-hosted runner's disk ("no space left on device") — each of these
  # is a full toolchain image (JDK+Android SDK/NDK, osxcross, GTK/WebKit,
  # ...), and `docker compose build`'s default `docker-container` driver
  # also duplicates every image's storage once for BuildKit's own cache and
  # again importing it into the local daemon. `--push` avoids that second
  # copy entirely by pushing straight from BuildKit to the registry, never
  # loading the image into the runner's local Docker daemon at all.
  #
  # Deliberately plain `docker compose`/`docker buildx` for the builder
  # images, not paws/dagger: this is release-infra tooling that runs once
  # per release, not part of paws's own container-execution seam (ADR-0001
  # is about paws's Rust code, not this workflow's build step).
  build-builders:
    name: build & push ${{ matrix.builder }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        builder:
          - linux-gnu
          - linux-musl-x86_64
          - linux-musl-aarch64
          - windows-gnu
          - macos
          - tauri-linux
          - tauri-android
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute CREATED timestamp
        run: echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # compose.yml's cache_from/cache_to use BuildKit's registry cache
      # exporter (type=registry) so build cache survives across separate
      # workflow runs on GitHub's ephemeral runners, not just within one -
      # the default `docker` buildx driver doesn't support that exporter
      # (confirmed directly: a build against it silently exports nothing),
      # only `docker-container` does, which this sets up as the active
      # builder `docker compose build` below picks up automatically.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mbround18
          password: ${{ secrets.DOCKER_TOKEN }}

      # `docker buildx bake` directly, not `docker compose build --push`:
      # the latter, on this runner's Docker Compose version, silently
      # loaded the built image into the local Docker daemon instead of
      # pushing it (no error, exit 0, only the BuildKit registry *cache*
      # actually landed) - reproduced twice, didn't reproduce locally
      # against the same compose.yml, and calling buildx directly (still
      # reading this same compose.yml as its bake definition) reliably
      # took the correct push path instead. compose.yml's build.tags
      # carries both the GHCR and Docker Hub refs for this target - see
      # its header comment for why they're both under build.tags and not
      # split across a top-level image: field (a second, separate bug).
      - name: Build & push ${{ matrix.builder }}
        run: docker buildx bake -f compose.yml --push ${{ matrix.builder }}

      # Belt-and-suspenders after two different silent-push bugs already
      # slipped past a green build step: fails loudly here instead of
      # downstream as a confusing "image not found" in `paws release`.
      - name: Verify ${{ matrix.builder }} actually landed in both registries
        run: |
          docker buildx imagetools inspect "ghcr.io/mbround18/paws-builders:${{ matrix.builder }}-${VERSION}" >/dev/null
          docker buildx imagetools inspect "docker.io/mbround18/paws-builders:${{ matrix.builder }}-${VERSION}" >/dev/null

  release:
    name: build & publish (${{ matrix.target }})
    needs: [ci, bootstrap, build-builders]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          # Build/link-verified only (see builders/macos/README.md) — no
          # Mach-O execution environment exists to smoke-test them, so
          # `paws release` builds, honestly skips the smoke test, and
          # packages anyway rather than failing the leg.
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

      # Reuses build-builders' bootstrap instead of re-running `cargo build
      # --release -p paws-cli` on every leg of this matrix — no Rust
      # toolchain install needed in this job at all, since only the
      # already-compiled binary is used from here on. Everything past this
      # point — cross-target build (via ./builders/*), the QEMU/Wine-backed
      # smoke test, packaging — is `paws release` orchestrating Dagger.
      - name: Download bootstrapped paws binary
        uses: actions/download-artifact@v4
        with:
          name: paws-bootstrap
          path: target/release

      - name: chmod +x the downloaded binary
        run: chmod +x target/release/paws

      - name: paws release --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          # A tag with a "-" (e.g. v0.0.1-prerelease.1) is a semver
          # prerelease; a plain vX.Y.Z tag is a full release.
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          ./target/release/paws release \
            --target ${{ matrix.target }} \
            --tag "$GITHUB_REF_NAME" \
            $prerelease_flag
